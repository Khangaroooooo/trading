name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: Byte-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile all scripts
        run: python -m compileall -q .

      - name: Assert no credentials are tracked
        run: |
          if git ls-files | grep -qiE '(^|/)\.env$|\.pem$|credentials'; then
            echo "Tracked credential-shaped file found:"
            git ls-files | grep -iE '(^|/)\.env$|\.pem$|credentials'
            exit 1
          fi
          echo "No tracked credential files."
